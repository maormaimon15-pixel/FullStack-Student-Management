version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: modern-backend-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: maor
      POSTGRES_PASSWORD: password
      POSTGRES_DB: student_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: